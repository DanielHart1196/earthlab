<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layers</title>
    <style>
      :root {
        color-scheme: dark;
        --earthlab-bg-top: #041019;
        --earthlab-bg-bottom: #07141b;
        --earthlab-panel-bg: rgba(9, 20, 29, 0.84);
        --earthlab-panel-border: rgba(255, 255, 255, 0.14);
        --earthlab-text: #edf6fb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #000000;
        color: var(--earthlab-text);
      }

      body {
        min-height: 100dvh;
      }

      .earthlab-app {
        position: relative;
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }

      .earthlab-map {
        position: absolute;
        inset: 0;
      }

      .earthlab-panel-header {
        opacity: 0;
        visibility: hidden;
      }

      .earthlab-layer-stack,
      .earthlab-share-wrap,
      .earthlab-reload {
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 180ms ease,
          transform 180ms ease;
        transform: translateY(8px);
      }

      body[data-earthlab-ui="ready"] .earthlab-panel-header,
      body[data-earthlab-stage="ready"] .earthlab-layer-stack,
      body[data-earthlab-stage="ready"] .earthlab-share-wrap,
      body[data-earthlab-stage="ready"] .earthlab-reload {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .earthlab-status {
        margin: 0;
        color: rgba(237, 246, 251, 0.72);
        white-space: pre-line;
      }
    </style>
  </head>
  <body data-earthlab-stage="boot" data-earthlab-ui="boot">
    <main class="earthlab-app" id="app">
      <div class="earthlab-map" id="map"></div>

      <section class="earthlab-panel" aria-label="Earth controls">
        <div class="earthlab-panel-header">
          <div class="earthlab-panel-bar">
            <p class="earthlab-kicker" id="mapNameLabel" contenteditable="true" spellcheck="false" enterkeyhint="done">Layers</p>
            <div class="earthlab-panel-actions" aria-label="Earthlab view actions">
              <button class="earthlab-panel-action" id="earthLayersBtn" type="button" aria-label="Collapse earth layers"></button>
              <button class="earthlab-panel-action" id="appearanceBtn" type="button" aria-label="Toggle appearance controls"></button>
              <button class="earthlab-panel-action" id="panelCloseBtn" type="button" aria-label="Close panel">×</button>
            </div>
          </div>
        </div>

        <div class="earthlab-layer-stack">
          <div class="earthlab-rows" id="appearanceRows" hidden>
            <article class="earthlab-row earthlab-row-parent" data-row-id="appearance">
              <span class="earthlab-row-swatch" id="appearanceSwatch" aria-hidden="true"></span>
              <button class="earthlab-row-toggle" id="appearanceToggle" type="button">
                Settings
              </button>
              <span class="earthlab-row-slot" aria-hidden="true"></span>
              <div class="earthlab-row-children" id="appearanceChildren" hidden>
                <article class="earthlab-row earthlab-row-child" data-row-id="background">
                  <span class="earthlab-row-swatch" id="backgroundSwatch" aria-hidden="true"></span>
                  <button class="earthlab-row-toggle" id="backgroundToggle" type="button">
                    Background
                  </button>
                  <span class="earthlab-row-slot" aria-hidden="true"></span>
                  <div class="earthlab-row-style" id="backgroundStyle" hidden>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <div class="earthlab-row-style-label">Color</div>
                        <div class="earthlab-row-style-value" id="backgroundColorValue"></div>
                      </div>
                      <div id="backgroundColorControl"></div>
                    </div>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <label class="earthlab-row-style-label" for="backgroundOpacitySlider">Opacity</label>
                        <div class="earthlab-row-style-value" id="backgroundOpacityValue"></div>
                      </div>
                      <input class="earthlab-range" type="range" id="backgroundOpacitySlider" min="0" max="100" step="1" value="100" />
                    </div>
                  </div>
                </article>
                <article class="earthlab-row earthlab-row-child" data-row-id="settings">
                  <span class="earthlab-row-swatch" id="settingsSwatch" aria-hidden="true"></span>
                  <button class="earthlab-row-toggle" id="settingsToggle" type="button">
                    Legend
                  </button>
                  <span class="earthlab-row-slot" aria-hidden="true"></span>
                  <div class="earthlab-row-style" id="settingsStyle" hidden>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <div class="earthlab-row-style-label">Color</div>
                        <div class="earthlab-row-style-value" id="settingsColorValue"></div>
                      </div>
                      <div id="settingsColorControl"></div>
                    </div>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <label class="earthlab-row-style-label" for="settingsOpacitySlider">Opacity</label>
                        <div class="earthlab-row-style-value" id="settingsOpacityValue"></div>
                      </div>
                      <input class="earthlab-range" type="range" id="settingsOpacitySlider" min="0" max="100" step="1" value="80" />
                    </div>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <div class="earthlab-row-style-label">Color</div>
                        <div class="earthlab-row-style-value" id="settingsLineColorValue"></div>
                      </div>
                      <div id="settingsLineColorControl"></div>
                    </div>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <label class="earthlab-row-style-label" for="settingsLineOpacitySlider">Opacity</label>
                        <div class="earthlab-row-style-value" id="settingsLineOpacityValue"></div>
                      </div>
                      <input class="earthlab-range" type="range" id="settingsLineOpacitySlider" min="0" max="100" step="1" value="100" />
                    </div>
                  </div>
                </article>
              </div>
            </article>
          </div>

          <div class="earthlab-rows" id="earthRows">
            <article class="earthlab-row earthlab-row-parent" data-row-id="earth">
              <span class="earthlab-row-swatch" id="earthSwatch" aria-hidden="true"></span>
              <button class="earthlab-row-toggle" id="earthToggle" type="button" role="checkbox" aria-checked="true">
                Earth
              </button>
              <span class="earthlab-row-slot" aria-hidden="true"></span>
              <div class="earthlab-row-children" id="earthChildren">
            <article class="earthlab-row earthlab-row-parent" data-row-id="land" data-reorder-id="land" data-reorder-scope="earth">
              <span class="earthlab-row-swatch" id="landSwatch" aria-hidden="true"></span>
              <button class="earthlab-row-toggle" id="landToggle" type="button" role="checkbox" aria-checked="true">
                Land
              </button>
              <span class="earthlab-row-slot" aria-hidden="true"></span>
              <div class="earthlab-row-children" id="landChildren" hidden>
                <article class="earthlab-row earthlab-row-child" data-row-id="landFill" data-layer-id="land.fill" data-reorder-id="land.fill" data-reorder-scope="land">
                  <span class="earthlab-row-swatch" id="landFillSwatch" aria-hidden="true"></span>
                  <button class="earthlab-row-toggle" id="landFillToggle" type="button" role="checkbox" aria-checked="true">
                    Fill
                  </button>
                  <span class="earthlab-row-slot" aria-hidden="true"></span>
                  <div class="earthlab-row-style" id="landFillStyle" hidden>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                      <div class="earthlab-row-style-label">Color</div>
                        <div class="earthlab-row-style-value" id="landFillColorValue"></div>
                      </div>
                      <div id="landFillColorControl"></div>
                    </div>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <label class="earthlab-row-style-label" for="landFillOpacitySlider">Opacity</label>
                        <div class="earthlab-row-style-value" id="landFillOpacityValue"></div>
                      </div>
                      <input class="earthlab-range" type="range" id="landFillOpacitySlider" min="0" max="100" step="1" value="100" />
                    </div>
                  </div>
                </article>
                <article class="earthlab-row earthlab-row-child" data-row-id="landLine" data-layer-id="land.line" data-reorder-id="land.line" data-reorder-scope="land">
                  <span class="earthlab-row-swatch" id="landLineSwatch" aria-hidden="true"></span>
                  <button class="earthlab-row-toggle" id="landLineToggle" type="button" role="checkbox" aria-checked="true">
                    Line
                  </button>
                  <span class="earthlab-row-slot" aria-hidden="true"></span>
                  <div class="earthlab-row-style" id="landLineStyle" hidden>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <label class="earthlab-row-style-label" for="landLineWidthSlider">Width</label>
                        <div class="earthlab-row-style-value" id="landLineWidthValue"></div>
                      </div>
                      <input class="earthlab-range" type="range" id="landLineWidthSlider" min="0" max="10" step="0.1" value="1" />
                    </div>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <div class="earthlab-row-style-label">Color</div>
                        <div class="earthlab-row-style-value" id="landLineColorValue"></div>
                      </div>
                      <div id="landLineColorControl"></div>
                    </div>
                    <div class="earthlab-style-control">
                      <div class="earthlab-style-control-header">
                        <label class="earthlab-row-style-label" for="landLineOpacitySlider">Opacity</label>
                        <div class="earthlab-row-style-value" id="landLineOpacityValue"></div>
                      </div>
                      <input class="earthlab-range" type="range" id="landLineOpacitySlider" min="0" max="100" step="1" value="100" />
                    </div>
                  </div>
                </article>
              </div>
            </article>
            <article class="earthlab-row" data-row-id="graticules" data-reorder-id="graticules" data-reorder-scope="earth">
              <span class="earthlab-row-swatch" id="graticulesSwatch" aria-hidden="true"></span>
              <button class="earthlab-row-toggle" id="graticulesToggle" type="button" role="checkbox" aria-checked="true">
                Graticules
              </button>
              <span class="earthlab-row-slot" aria-hidden="true"></span>
              <div class="earthlab-row-style" id="graticulesStyle" hidden>
                <div class="earthlab-style-control">
                  <div class="earthlab-style-control-header">
                    <label class="earthlab-row-style-label" for="graticulesWidthSlider">Width</label>
                    <div class="earthlab-row-style-value" id="graticulesWidthValue"></div>
                  </div>
                  <input class="earthlab-range" type="range" id="graticulesWidthSlider" min="0" max="10" step="0.1" value="1" />
                </div>
                <div class="earthlab-style-control">
                  <div class="earthlab-style-control-header">
                    <div class="earthlab-row-style-label">Color</div>
                    <div class="earthlab-row-style-value" id="graticulesColorValue"></div>
                  </div>
                  <div id="graticulesColorControl"></div>
                </div>
                <div class="earthlab-style-control">
                  <div class="earthlab-style-control-header">
                    <label class="earthlab-row-style-label" for="graticulesOpacitySlider">Opacity</label>
                    <div class="earthlab-row-style-value" id="graticulesOpacityValue"></div>
                  </div>
                  <input class="earthlab-range" type="range" id="graticulesOpacitySlider" min="0" max="100" step="1" value="100" />
                </div>
              </div>
            </article>
            <article class="earthlab-row" data-row-id="ocean" data-reorder-id="ocean" data-reorder-scope="earth">
              <span class="earthlab-row-swatch" id="oceanSwatch" aria-hidden="true"></span>
              <button class="earthlab-row-toggle" id="oceanToggle" type="button" role="checkbox" aria-checked="true">
                Ocean
              </button>
              <span class="earthlab-row-slot" aria-hidden="true"></span>
              <div class="earthlab-row-style" id="oceanStyle" hidden>
                <div class="earthlab-style-control">
                  <div class="earthlab-style-control-header">
                    <div class="earthlab-row-style-label">Color</div>
                    <div class="earthlab-row-style-value" id="oceanColorValue"></div>
                  </div>
                  <div id="oceanColorControl"></div>
                </div>
                <div class="earthlab-style-control">
                  <div class="earthlab-style-control-header">
                    <label class="earthlab-row-style-label" for="oceanOpacitySlider">Opacity</label>
                    <div class="earthlab-row-style-value" id="oceanOpacityValue"></div>
                  </div>
                  <input class="earthlab-range" type="range" id="oceanOpacitySlider" min="0" max="100" step="1" value="100" />
                </div>
              </div>
            </article>
              </div>
            </article>
          </div>

          <div class="earthlab-rows" id="dynamicRows" hidden></div>

          <button class="earthlab-add-layer" id="addLayerBtn" type="button" aria-expanded="false">
            + Add layer
          </button>
        </div>
      </section>

      <section class="earthlab-add-panel" id="addLayerPanel" aria-label="Add layer options" hidden>
        <div class="earthlab-add-panel-body">
          <label class="earthlab-existing-search">
            <span class="earthlab-visually-hidden">Search existing layers</span>
            <input id="addLayerSearchInput" type="search" placeholder="Search layers" autocomplete="off" spellcheck="false" />
          </label>
          <div class="earthlab-existing-placeholder" id="addLayerExistingList">
            <span class="earthlab-existing-placeholder-title">Existing layers</span>
            <span class="earthlab-existing-placeholder-copy">Supabase catalog loading will be wired in the next pass.</span>
          </div>
          <button class="earthlab-add-new-layer" id="addNewLayerBtn" type="button" aria-label="Create new layer">+</button>
        </div>
      </section>
      <div class="earthlab-share-wrap">
        <span class="earthlab-share-print">Print |</span>
        <button class="earthlab-share" id="shareBtn" type="button" title="Copy share URL" aria-label="Copy share URL"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 18" width="1em" height="1em" fill="none" aria-hidden="true" focusable="false" style="display:inline-block;vertical-align:middle"><circle cx="13.5" cy="3.5" r="2" fill="currentColor"/><circle cx="4.5" cy="9" r="2" fill="currentColor"/><circle cx="13.5" cy="14.5" r="2" fill="currentColor"/><line x1="6.3" y1="8.1" x2="11.7" y2="4.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="6.3" y1="9.9" x2="11.7" y2="13.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      </div>
      <div class="earthlab-share-popup" id="sharePopup" hidden>
        <p class="earthlab-share-popup-title">Map URL copied</p>
        <p class="earthlab-share-popup-url" id="sharePopupUrl"></p>
        <p class="earthlab-share-popup-hint">Send this to a friend and they'll see your map (layers, styling, position and zoom)</p>
      </div>
      <button class="earthlab-reload" id="reloadBtn" type="button" title="Reload" aria-label="Reload page"></button>
      <menu class="earthlab-reload-menu" id="reloadMenu" hidden>
        <li><button type="button" id="hardReloadBtn">Hard reload</button></li>
        <li><button type="button" id="clearReloadBtn">Clear cache &amp; reload</button></li>
      </menu>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
